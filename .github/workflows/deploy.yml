name: Deploy to Render

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The Docker image tag to deploy'
        required: true
        type: string

  workflow_call:
    inputs:
      image_tag:
        description: 'The Docker image tag to deploy'
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy to Render
        run: |
          FULL_IMAGE="ghcr.io/${{ github.repository }}/owe-me-api:${{ inputs.image_tag }}"
          ENCODED=$(jq -rn --arg v "$FULL_IMAGE" '$v|@uri')
          curl -f "${DEPLOY_HOOK}&imgURL=${ENCODED}"

      - name: Install Render CLI
        run: curl -fsSL https://raw.githubusercontent.com/render-oss/cli/refs/heads/main/bin/install.sh | sh

      - name: Deploy and wait for result
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          render deploys create "${{ secrets.RENDER_SERVICE_ID_IDENTITY }}" \
            --image "ghcr.io/yourorg/owe-me-identity@${{ steps.push.outputs.digest }}" \
            --wait \
            --confirm \
            --output json

  smoke-tests:
    needs: deploy
    uses: ./.github/workflows/run-smoketests.yml
    secrets: inherit