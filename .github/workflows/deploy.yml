name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'Id of the artifact to deploy'
        required: true
        type: string

  workflow_call:
    inputs:
      artifact_id:
        description: 'Id of the artifact to deploy'
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Deploy to Render
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true

  smoke-tests:
    needs: deploy
    uses: ./.github/workflows/run-smoketests.yml
    secrets: inherit
