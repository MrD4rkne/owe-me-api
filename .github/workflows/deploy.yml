name: Deploy to Render

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The Docker image tag to deploy'
        required: true
        type: string

  workflow_call:
    inputs:
      image_tag:
        description: 'The Docker image tag to deploy'
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Render
        run: |
          FULL_IMAGE="ghcr.io/${{ github.repository }}/owe-me-api:${{ inputs.image_tag }}"
          
          # URL-encode the image URL safely
          ENCODED_URL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$FULL_IMAGE', safe=''))")
          
          # Extract the Base URL and the Key if they exist
          HOOK_BASE="${{ secrets.RENDER_DEPLOY_HOOK }}"
          
          # If the secret already has '?', we append with '&', otherwise '?'
          if [[ "$HOOK_BASE" == *"?"* ]]; then
            TARGET_URL="${HOOK_BASE}&imgURL=${ENCODED_URL}"
          else
            TARGET_URL="${HOOK_BASE}?imgURL=${ENCODED_URL}"
          fi
          
          curl -X POST "$TARGET_URL"
