name: Deploy to Render

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'The full Docker image reference to deploy'
        required: true
        type: string

  workflow_call:
    inputs:
      image_ref:
        description: 'The full Docker image reference to deploy'
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Install Render CLI
        run: curl -fsSL https://raw.githubusercontent.com/render-oss/cli/refs/heads/main/bin/install.sh | sh

      - name: Set variables
        run: |
          echo "FULL_IMAGE_REF=${{ inputs.image_ref }}" >> ${GITHUB_ENV}

      - name: Deploy and wait for result
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          FULL_IMAGE_REF: ${{ env.FULL_IMAGE_REF }}
        run: |
          echo "Deploying canonical image: $FULL_IMAGE_REF"
          
          render deploys create "${{ secrets.RENDER_SERVICE_ID_IDENTITY }}" \
            --image "$FULL_IMAGE_REF" \
            --wait \
            --confirm \
            --output json

  smoke-tests:
    needs: deploy
    uses: ./.github/workflows/run-smoketests.yml
    secrets: inherit