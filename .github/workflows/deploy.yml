name: Deploy to Render

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The Docker image tag to deploy'
        required: true
        type: string

  workflow_call:
    inputs:
      image_tag:
        description: 'The Docker image tag to deploy'
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Render
        run: |
          FULL_IMAGE="ghcr.io/${{ github.repository }}/owe-me-api:${{ inputs.image_tag }}"
          # URL-encode the image URL for the Render hook
          ENCODED_URL=$(echo "$FULL_IMAGE" | sed 's/:/%3A/g; s/\//%2F/g')
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}?imgURL=$ENCODED_URL"
