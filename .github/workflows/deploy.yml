name: Deploy to Render

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The Docker image tag to deploy'
        required: true
        type: string

  workflow_call:
    inputs:
      image_tag:
        description: 'The Docker image tag to deploy'
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Install Render CLI
        run: curl -fsSL https://raw.githubusercontent.com/render-oss/cli/refs/heads/main/bin/install.sh | sh
      - name: Deploy and wait for result
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          render deploys create "${{ secrets.RENDER_SERVICE_ID_IDENTITY }}" \
            --image "$IMAGE_TAG" \
            --wait \
            --confirm \
            --output json

  smoke-tests:
    needs: deploy
    uses: ./.github/workflows/run-smoketests.yml
    secrets: inherit