services:
  - type: web
    name: owe-me-p-api
    runtime: docker
    image:
      url: ghcr.io/mrd4rkne/owe-me-api/owe-me-api:latest
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: owe-me-p-db
          property: connectionString

databases:
  - name: owe-me-p-db
    plan: free
    databaseName: owemedb
    user: owemeuser