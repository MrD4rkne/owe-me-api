services:
  - type: web
    name: owe-me-api
    runtime: docker
    plan: free
    # # This runs BEFORE the new version goes live—perfect for migrations
    # preDeployCommand: dotnet ef database update 
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: owe-me-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

databases:
  - name: owe-me-db
    plan: free
    databaseName: owemedb
    user: owemeuser