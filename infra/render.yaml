services:
  - type: image
    name: owe-me-p-api
    image:
      url: ghcr.io/mrd4rkne/owe-me-api/owe-me-api:latest # Default image
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: owe-me-p-db
          property: connectionString

databases:
  - name: owe-me-p-db
    plan: free
    databaseName: owemedb
    user: owemeuser