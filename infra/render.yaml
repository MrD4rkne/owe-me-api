services:
  - type: web
    name: oweme-p-api
    runtime: docker
    image:
      url: ghcr.io/mrd4rkne/owe-me-api/owe-me-api:1.0.39-g7924b3ee19
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: owe-me-p-db
          property: connectionString

databases:
  - name: oweme-p-db
    plan: free
    databaseName: owemedb
    user: owemeuser